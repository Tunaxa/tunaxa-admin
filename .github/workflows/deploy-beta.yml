name: Deploy Beta (Pre-production)

on:
  push:
    branches:
      - dev

concurrency:
  group: beta-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Beta Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend (Beta)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/tunaxa/tunaxa-admin-backend:beta
            ghcr.io/tunaxa/tunaxa-admin-backend:beta-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend (Beta)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-beta.tunaxa.com
          tags: |
            ghcr.io/tunaxa/tunaxa-admin-frontend:beta
            ghcr.io/tunaxa/tunaxa-admin-frontend:beta-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Beta VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "Logging into GHCR on VPS..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/tunaxa-admin/beta

            echo "Exporting image versions..."
            export BACKEND_IMAGE=ghcr.io/tunaxa/tunaxa-admin-backend:beta-${{ github.sha }}
            export FRONTEND_IMAGE=ghcr.io/tunaxa/tunaxa-admin-frontend:beta-${{ github.sha }}

            echo "Pulling new beta images..."
            docker compose pull backend frontend

            echo "Starting databases if not already running..."
            docker compose up -d postgres mongo redis

            echo "Running Prisma migrations..."
            docker compose run --rm --no-deps backend npm run db:deploy

            echo "Recreating app containers..."
            docker compose up -d --no-deps backend frontend

            echo "Pruning unused images..."
            docker image prune -f

            echo "Beta deployment finished successfully!"
