name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend (Prod)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/tunaxa/tunaxa-admin-backend:latest
            ghcr.io/tunaxa/tunaxa-admin-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend (Prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.tunaxa.com
          tags: |
            ghcr.io/tunaxa/tunaxa-admin-frontend:latest
            ghcr.io/tunaxa/tunaxa-admin-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "Logging into GHCR on VPS..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/tunaxa-admin/production

            echo "Exporting image versions..."
            export BACKEND_IMAGE=ghcr.io/tunaxa/tunaxa-admin-backend:${{ github.sha }}
            export FRONTEND_IMAGE=ghcr.io/tunaxa/tunaxa-admin-frontend:${{ github.sha }}

            echo "Pulling new production images..."
            docker compose pull backend frontend

            echo "Running Prisma migrations..."
            docker compose run --rm --no-deps \
              -e DATABASE_URL="$(grep '^POSTGRES_USER' .env | cut -d= -f2):$(grep '^POSTGRES_PASSWORD' .env | cut -d= -f2)@postgres:5432/$(grep '^POSTGRES_DB' .env | cut -d= -f2)?schema=public" \
              backend npm run db:deploy

            echo "Recreating app containers..."
            docker compose up -d --no-deps backend frontend

            echo "Pruning unused images..."
            docker image prune -f

            echo "Production deployment finished successfully!"
